name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-release-version.sh "${GITHUB_REF_NAME}"

  build:
    name: Build ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-26
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          xcode_path="$(python3 - <<'PY'
          from pathlib import Path

          candidates = list(Path("/Applications").glob("Xcode_26*.app"))
          if not candidates:
              raise SystemExit("The runner does not provide Xcode 26")

          def version(path):
              return tuple(int(part) for part in path.stem.removeprefix("Xcode_").split("."))

          print(max(candidates, key=version))
          PY
          )"
          sudo xcode-select --switch "$xcode_path/Contents/Developer"
          xcodebuild -version
          test -x "$(dirname "$(xcode-select -p)")/Applications/Icon Composer.app/Contents/Executables/ictool"

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Prepare Developer ID signing
        if: vars.APPLE_DEVELOPER_ID_RELEASES == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?Missing signing certificate}"
          : "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${SIGNING_IDENTITY:?Missing signing identity}"
          : "${APPLE_ID:?Missing Apple ID}"
          : "${APPLE_TEAM_ID:?Missing Apple team ID}"
          : "${APPLE_APP_PASSWORD:?Missing notary app password}"
          signing_keychain="$RUNNER_TEMP/usagetracker-signing.keychain-db"
          signing_password="$(openssl rand -hex 32)"
          echo "::add-mask::$signing_password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/usagetracker-certificate.p12"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security import "$RUNNER_TEMP/usagetracker-certificate.p12" \
            -k "$signing_keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$signing_password" "$signing_keychain" >/dev/null
          security list-keychains -d user -s "$signing_keychain"
          xcrun notarytool store-credentials usagetracker-release \
            --keychain "$signing_keychain" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          printf 'CODESIGN_IDENTITY=%s\nNOTARYTOOL_PROFILE=usagetracker-release\nNOTARYTOOL_KEYCHAIN=%s\n' \
            "$SIGNING_IDENTITY" "$signing_keychain" >> "$GITHUB_ENV"

      - name: Build and verify artifacts
        env:
          BUNDLE_VERSION: ${{ github.run_number }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./scripts/package-release.sh "${{ matrix.target }}" dist

      - name: Remove signing credentials
        if: always() && vars.APPLE_DEVELOPER_ID_RELEASES == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/usagetracker-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/usagetracker-certificate.p12"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Add installer and checksums
        run: |
          cp scripts/install.sh scripts/uninstall.sh dist/
          cd dist
          sha256sum \
            UsageTracker-macos-arm64.zip \
            UsageTracker-macos-x86_64.zip \
            usage-macos-arm64.tar.gz \
            usage-macos-x86_64.tar.gz \
            install.sh \
            uninstall.sh > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --title "UsageTracker ${GITHUB_REF_NAME#v}"
